<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chorus" />
  <meta name="application-name" content="Chorus" />
  <meta name="theme-color" content="#4a0d1c" />
  <title>Chorus — Understanding the Self</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #fdf8f9;
      --bg-card: #ffffff;
      --border-color: #ecd9de;
      --text-primary: #2a0a12;
      --text-secondary: #7c4d58;
      --maroon-dark: #4a0d1c;
      --maroon: #7a1c33;
      --maroon-light: #a32947;
      --rose-tint: #f9eef0;
      --gold: #c9965b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body.dark {
      --bg-page: #120408;
      --bg-card: #1d080e;
      --border-color: #3d1620;
      --text-primary: #fcf2f4;
      --text-secondary: #c498a3;
      --rose-tint: #2b0d16;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      padding-bottom: calc(64px + var(--safe-bottom));
      transition: background-color 0.25s, color 0.25s;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      touch-action: manipulation;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid #8f243d;
      outline-offset: 2px;
    }

    .topbar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding-top: var(--safe-top);
    }

    .topbar-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 16px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-logo {
      font-family: 'Grand Hotel', Georgia, cursive;
      font-size: 36px;
      line-height: 1;
      text-decoration: none;
      color: #7a1c33;
      background: linear-gradient(135deg, #4a0d1c, #8f243d, #c9965b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body.dark .brand-logo {
      color: #f4b8c5;
      background: linear-gradient(135deg, #f4b8c5, #d45d79, #e5b880);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: #7a1c33;
      color: #ffffff;
    }

    .search-box {
      flex: 1;
      max-width: 320px;
    }

    .search-input {
      width: 100%;
      font-size: 16px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background-color: var(--rose-tint);
      color: var(--text-primary);
      outline: none;
      -webkit-appearance: none;
    }

    @media (min-width: 768px) {
      .search-input {
        font-size: 13px;
      }
    }

    .search-input:focus {
      border-color: #7a1c33;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-maroon {
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      background-color: #7a1c33;
      color: #ffffff;
      transition: background-color 0.2s;
    }

    .btn-maroon:hover {
      background-color: #5c1124;
    }

    .btn-theme {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background-color: var(--rose-tint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .main-grid {
      max-width: 1060px;
      margin: 0 auto;
      padding: 20px 16px 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    @media (min-width: 960px) {
      .main-grid {
        grid-template-columns: minmax(0, 640px) 320px;
        justify-content: center;
      }
    }

    .feed-col {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
    }

    .stories-card {
      padding: 14px 16px;
    }

    .stories-row {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .stories-row::-webkit-scrollbar,
    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .story-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 0;
      transition: transform 0.15s;
    }

    .story-btn:hover {
      transform: translateY(-2px);
    }

    .story-ring {
      background: linear-gradient(45deg, #4a0d1c, #8f243d, #c9965b);
      padding: 2.5px;
      border-radius: 999px;
      display: inline-flex;
    }

    .story-avatar {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid var(--bg-card);
      display: block;
    }

    .story-label {
      font-size: 11px;
      font-weight: 500;
      max-width: 74px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .filter-pill {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: border-color 0.2s, background-color 0.2s;
    }

    .filter-pill:hover {
      border-color: #7a1c33;
    }

    .filter-pill.active {
      background-color: #7a1c33;
      color: #ffffff;
      border-color: #7a1c33;
    }

    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .post-card {
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(74, 13, 28, 0.05);
    }

    .post-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      object-fit: cover;
      border: 1.5px solid var(--bg-card);
      display: block;
    }

    .author-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .author-handle {
      font-weight: 700;
      font-size: 14px;
    }

    .chapter-chip {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: var(--rose-tint);
      color: #7a1c33;
      border: 1px solid var(--border-color);
    }

    body.dark .chapter-chip {
      color: #f4b8c5;
    }

    .author-loc {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .slide-counter {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .carousel-box {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .slide-photo-wrap {
      position: relative;
      width: 100%;
      height: 410px;
      background-color: #2a0a12;
    }

    .slide-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      display: block;
    }

    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #2a0a12 8%, rgba(74, 13, 28, 0.5) 55%, transparent 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #ffffff;
    }

    .slide-badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: #7a1c33;
      margin-bottom: 8px;
    }

    .slide-badge-soft {
      background-color: rgba(255, 255, 255, 0.16);
    }

    .slide-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .slide-text {
      margin: 0;
      font-size: 13px;
      color: #ffe4ea;
      line-height: 1.55;
    }

    .slide-card-panel {
      width: 100%;
      height: 410px;
      background: linear-gradient(135deg, #4a0d1c, #6d172c, #8f243d);
      color: #ffffff;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-bullets {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      line-height: 1.55;
      color: #fff1f4;
    }

    .slide-bullets li {
      display: flex;
      gap: 10px;
    }

    .bullet-star {
      color: #f3c68f;
      font-weight: 700;
    }

    .st-panel {
      width: 100%;
      height: 410px;
      background: linear-gradient(135deg, #2a0a12, #4a0d1c, #7a1c33);
      color: #ffffff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .st-metrics {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-top: 6px;
    }

    .st-lbl {
      margin: 0;
      font-size: 10px;
      text-transform: uppercase;
      color: #fecdd3;
    }

    .st-big {
      margin: 2px 0 0;
      font-size: 24px;
      font-weight: 800;
      color: #f3c68f;
    }

    .st-subval {
      margin: 2px 0 0;
      font-size: 14px;
      font-weight: 700;
    }

    .st-bars {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .st-bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .st-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .st-fill {
      height: 100%;
      border-radius: 999px;
      background: #e5b880;
    }

    .st-foot {
      margin: 0;
      font-size: 11px;
      color: #ffe4ea;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      padding-top: 8px;
    }

    .collage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: auto 0;
    }

    .collage-tile {
      border-radius: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .collage-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #f3c68f;
    }

    .collage-title {
      margin: 8px 0 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .collage-sub {
      margin: 0;
      font-size: 11px;
      color: #ffe4ea;
      line-height: 1.45;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.52);
      color: #ffffff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .nav-arrow:hover {
      background: rgba(0, 0, 0, 0.78);
    }

    .nav-prev { left: 12px; }
    .nav-next { right: 12px; }

    .action-bar {
      padding: 10px 16px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      font-size: 20px;
      padding: 2px;
      transition: transform 0.15s;
    }

    .icon-btn:hover {
      transform: scale(1.12);
    }

    .dots-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      height: 6px;
      width: 6px;
      border-radius: 999px;
      background-color: #d8b8c0;
      transition: width 0.2s;
    }

    .dot.active {
      width: 16px;
      background-color: #7a1c33;
    }

    .post-body {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .likes-text {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .caption-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .hashtags-text {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      color: #8f243d;
    }

    body.dark .hashtags-text {
      color: #f4b8c5;
    }

    .notes-summary {
      font-size: 12px;
      font-weight: 600;
      color: #7a1c33;
      cursor: pointer;
    }

    body.dark .notes-summary {
      color: #f4b8c5;
    }

    .notes-list {
      margin: 8px 0 0;
      padding: 10px 12px 10px 24px;
      border-radius: 12px;
      background-color: var(--rose-tint);
      border: 1px solid var(--border-color);
      font-size: 12px;
      line-height: 1.5;
    }

    .comments-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .comment-form {
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
    }

    @media (min-width: 768px) {
      .comment-input {
        font-size: 13px;
      }
    }

    .comment-submit {
      font-size: 12px;
      font-weight: 700;
      color: #7a1c33;
    }

    body.dark .comment-submit {
      color: #f4b8c5;
    }

    .sidebar-col {
      display: none;
    }

    @media (min-width: 960px) {
      .sidebar-col {
        display: block;
      }
    }

    .sidebar-sticky {
      position: -webkit-sticky;
      position: sticky;
      top: 82px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .profile-card {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-badge {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background-color: #4a0d1c;
      color: #ffffff;
      font-weight: 800;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dir-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dir-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dir-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .dir-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dir-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .dir-avatar {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .story-modal-card {
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      overflow: hidden;
      background-color: #2a0a12;
      color: #ffffff;
      border: 1px solid #7a1c33;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }

    .story-bars {
      padding: 12px 14px 8px;
      display: flex;
      gap: 5px;
    }

    .story-bar-seg {
      height: 3px;
      flex: 1;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
    }

    .story-bar-seg.done {
      background: #ffffff;
    }

    .story-top {
      padding: 0 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .story-body {
      position: relative;
      height: 330px;
    }

    .story-jump {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: #ffffff;
      color: #4a0d1c;
      font-weight: 700;
      font-size: 12px;
      margin-top: 12px;
    }

    .refs-modal-card {
      width: 100%;
      max-width: 640px;
      max-height: 82vh;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .refs-head {
      padding: 14px 18px;
      background-color: #4a0d1c;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .refs-body {
      padding: 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 12px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @keyframes heartPop {
      0% { transform: scale(0.4); opacity: 0; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    .heart-burst {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      pointer-events: none;
      animation: heartPop 0.75s ease-out forwards;
    }

    .heart-burst.show {
      display: flex;
    }

    @media (max-width: 520px) {
      .badge-pill { display: none; }
      .slide-photo-wrap, .slide-card-panel, .st-panel { height: 350px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap">
        <a href="javascript:void(0)" onclick="resetFeed()" class="brand-logo">Chorus</a>
        <span class="badge-pill">Ch. 1–6</span>
      </div>

      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Search concepts, theorists..."
          oninput="renderFeed()" class="search-input" />
      </div>

      <div class="nav-actions">
        <button type="button" onclick="openModal('refsModal')" class="btn-maroon">References</button>
        <button type="button" onclick="toggleTheme()" title="Toggle Theme" class="btn-theme">🌓</button>
      </div>
    </div>
  </header>

  <main class="main-grid">
    <section class="feed-col">
      <div class="card stories-card">
        <div id="storiesBar" class="stories-row"></div>
      </div>

      <div id="filterBar" class="filter-row"></div>

      <div id="feedContainer" class="posts-list"></div>
    </section>

    <aside class="sidebar-col">
      <div class="sidebar-sticky">
        <div class="card profile-card">
          <div class="story-ring">
            <div class="profile-badge">C</div>
          </div>
          <div style="flex:1; min-width:0;">
            <p style="margin:0; font-weight:700; font-size:14px;">chorus.study</p>

    function renderStories() {
      var bar = document.getElementById("storiesBar");
      bar.innerHTML = CHAPTERS.map(function(ch, idx) {

            '<img src="' + ch.avatar + '" alt="' + ch.handle + '" class="story-avatar" />' +
          '</div>' +
          '<span class="story-label">' + ch.handle + '</span>' +
        '</button>';
      }).join("");
    }

    function openStory(idx) {
      var ch = CHAPTERS[idx];
      document.getElementById("storyProgressBars").innerHTML = CHAPTERS.map(function(_, i) {
        return '<div class="story-bar-seg ' + (i <= idx ? 'done' : '') + '"></div>';
      }).join("");
      document.getElementById("storyAvatar").src = ch.avatar;
      document.getElementById("storyHandle").textContent = "@" + ch.handle;
      document.getElementById("storySubtitle").textContent = ch.location;
      var firstPhoto = ch.avatar;
      for (var i = 0; i < ch.slides.length; i++) {
        if (ch.slides[i].img) { firstPhoto = ch.slides[i].img; break; }
      }
      document.getElementById("storyImage").src = firstPhoto;
      document.getElementById("storyBadge").textContent = ch.chapterTag;
      document.getElementById("storyTitle").textContent = ch.storyTitle;
      document.getElementById("storyQuote").textContent = '"' + ch.storyQuote + '"';
      document.getElementById("storyJumpBtn").onclick = function() {
        closeModal("storyModal");
        setFilter(ch.id);
      };
      openModal("storyModal");
    }

      bar.innerHTML = pills.map(function(p) {
        var active = activeFilter === p.id;
        return '<button type="button" onclick="setFilter(\'' + p.id + '\')" class="filter-pill ' + (active ? 'active' : '') + '">' + p.label + '</button>';
      }).join("");

          '<div>' +
            '<span class="slide-badge slide-badge-soft">' + slide.badge + '</span>' +
            '<h3 class="slide-title">' + slide.title + '</h3>' +
          '</div>' +
          '<div class="collage-grid">' +
            '<div class="collage-tile">' +
              '<span class="collage-tag">Politics • News</span>' +
              '<p class="collage-title">' + slide.leftTitle + '</p>' +
              '<p class="collage-sub">' + slide.leftSub + '</p>' +
            '</div>' +
            '<div class="collage-tile">' +
              '<span class="collage-tag">Sports • UAAP</span>' +
              '<p class="collage-title">' + slide.rightTitle + '</p>' +
              '<p class="collage-sub">' + slide.rightSub + '</p>' +
            '</div>' +
          '</div>' +
          '<p class="st-foot">' + slide.footer + '</p>' +
        '</div>';
      }

      return '<div class="slide-card-panel">' +
        '<span class="slide-badge slide-badge-soft">' + slide.badge + '</span>' +
        '<h3 class="slide-title">' + slide.title + '</h3>' +
        '<ul class="slide-bullets">' +
          slide.bullets.map(function(b) {
            return '<li><span class="bullet-star">✦</span><span>' + b + '</span></li>';
          }).join("") +
        '</ul>' +
      '</div>';
    }

    function changeSlide(chId, dir) {
      var ch = CHAPTERS.find(function(c) { return c.id === chId; });
      var total = ch.slides.length;
      slideState[chId] = (slideState[chId] + dir + total) % total;
      renderFeed();
    }

    function handleTouchStart(e) {
      if (e.touches && e.touches.length) {
        touchStartX = e.touches[0].clientX;
      }
    }

    function handleTouchEnd(e, chId) {
      if (!e.changedTouches || !e.changedTouches.length) return;
      var diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 40) {
        changeSlide(chId, diff < 0 ? 1 : -1);
      }
    }

    function doubleTapLike(chId) {
      var ch = CHAPTERS.find(function(c) { return c.id === chId; });
      if (!ch.liked) {
        ch.liked = true;
        ch.likes++;
      }
      renderFeed();
      var burst = document.getElementById("burst-" + chId);
      if (burst) {
        burst.classList.add("show");
        setTimeout(function() { burst.classList.remove("show"); }, 750);
      }
    }

    function toggleLike(chId) {
      var ch = CHAPTERS.find(function(c) { return c.id === chId; });
      ch.liked = !ch.liked;
      ch.likes += ch.liked ? 1 : -1;
      renderFeed();
    }

    function toggleSave(chId) {
      var ch = CHAPTERS.find(function(c) { return c.id === chId; });
      ch.saved = !ch.saved;
      renderFeed();
    }

    function addComment(e, chId) {
      e.preventDefault();
      var input = document.getElementById("comment-input-" + chId);
      var text = input.value.trim();
      if (!text) return;
      var ch = CHAPTERS.find(function(c) { return c.id === chId; });
      ch.comments.push({ user: "you", text: text });
      input.value = "";
      renderFeed();
    }

    function renderFeed() {
      var query = document.getElementById("searchInput").value.toLowerCase().trim();
      var container = document.getElementById("feedContainer");

      var filtered = CHAPTERS.filter(function(ch) {
        var matchesFilter = activeFilter === "all" || ch.id === activeFilter;
        var blob = (ch.chapterTag + " " + ch.handle + " " + ch.location + " " + ch.caption + " " + ch.hashtags + " " + JSON.stringify(ch.slides)).toLowerCase();
        return matchesFilter && (!query || blob.indexOf(query) !== -1);
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="card" style="padding:36px; text-align:center;">' +
          '<p style="margin:0 0 8px; font-weight:700; font-size:14px;">No matching chapters found</p>' +
          '<button type="button" onclick="resetFeed()" style="font-size:12px; font-weight:700; color:#8f243d; text-decoration:underline;">Reset filters</button>' +
        '</div>';
        return;
      }

      container.innerHTML = filtered.map(function(ch) {
        var idx = slideState[ch.id] || 0;
        var currentSlide = ch.slides[idx];

        return '<article class="card post-card">' +
          '<div class="post-header">' +
            '<div class="post-author">' +
              '<div class="story-ring">' +
                '<img src="' + ch.avatar + '" alt="' + ch.handle + '" class="post-avatar" />' +
              '</div>' +
              '<div>' +
                '<div class="author-top">' +
                  '<span class="author-handle">' + ch.handle + '</span>' +
                  '<span class="chapter-chip">' + ch.chapterTag + '</span>' +
                '</div>' +
                '<p class="author-loc">' + ch.location + '</p>' +
              '</div>' +
            '</div>' +
            '<span class="slide-counter">' + (idx + 1) + '/' + ch.slides.length + '</span>' +
          '</div>' +

          '<div class="carousel-box" ondblclick="doubleTapLike(\'' + ch.id + '\')" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event, \'' + ch.id + '\')">' +
            renderSlideContent(currentSlide) +
            '<div id="burst-' + ch.id + '" class="heart-burst">❤️</div>' +
            (ch.slides.length > 1 ?
              '<button type="button" onclick="changeSlide(\'' + ch.id + '\', -1)" class="nav-arrow nav-prev" aria-label="Previous">‹</button>' +
              '<button type="button" onclick="changeSlide(\'' + ch.id + '\', 1)" class="nav-arrow nav-next" aria-label="Next">›</button>'
            : '') +
          '</div>' +

          '<div class="action-bar">' +
            '<div class="action-left">' +
              '<button type="button" onclick="toggleLike(\'' + ch.id + '\')" class="icon-btn" aria-label="Like">' + (ch.liked ? "❤️" : "🤍") + '</button>' +
              '<label for="comment-input-' + ch.id + '" class="icon-btn" style="cursor:pointer;">💬</label>' +
            '</div>' +
            '<div class="dots-row">' +
              ch.slides.map(function(_, sIdx) {
                return '<span class="dot ' + (sIdx === idx ? 'active' : '') + '"></span>';
              }).join("") +
            '</div>' +
            '<button type="button" onclick="toggleSave(\'' + ch.id + '\')" class="icon-btn" aria-label="Save">' + (ch.saved ? "🔖" : "📑") + '</button>' +
          '</div>' +

          '<div class="post-body">' +
            '<p class="likes-text">' + ch.likes.toLocaleString() + ' likes</p>' +
            '<p class="caption-text"><strong style="margin-right:5px;">' + ch.handle + '</strong>' + ch.caption + '</p>' +
            '<p class="hashtags-text">' + ch.hashtags + '</p>' +
            '<details>' +
              '<summary class="notes-summary">View Chapter Key Takeaways</summary>' +
              '<ul class="notes-list">' +
                ch.notes.map(function(n) { return '<li>' + n + '</li>'; }).join("") +
              '</ul>' +
            '</details>' +
            (ch.comments.length ?
              '<div class="comments-box">' +
                ch.comments.map(function(c) {
                  return '<div><strong style="margin-right:5px;">' + c.user + '</strong>' + c.text + '</div>';
                }).join("") +
              '</div>'
            : '') +
            '<form onsubmit="addComment(event, \'' + ch.id + '\')" class="comment-form">' +
              '<input id="comment-input-' + ch.id + '" type="text" placeholder="Add a study reflection..." class="comment-input" />' +
              '<button type="submit" class="comment-submit">Post</button>' +
            '</form>' +
          '</div>' +
        '</article>';
      }).join("");
    }

    function renderReferences() {
      document.getElementById("refsBody").innerHTML = REFERENCES.map(function(sec) {
        return '<div>' +
          '<h3 style="margin:0 0 6px; font-size:13px; font-weight:700; color:#7a1c33;">' + sec.chapter + '</h3>' +
          '<ul style="margin:0; padding-left:18px; color:var(--text-secondary);">' +
            sec.items.map(function(item) { return '<li style="margin-bottom:4px;">' + item + '</li>'; }).join("") +
          '</ul>' +
        '</div>';
      }).join("");
    }

    renderStories();
    renderFilters();
    renderSidebar();
    renderFeed();
    renderReferences();
  </script>
</body>
</html>
