

<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Chorus — Understanding the Self</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"> <style> :root { --bg-page: #fdf8f9; --bg-card: #ffffff; --border-color: #ecd9de; --text-primary: #2a0a12; --text-secondary: #7c4d58; --maroon-dark: #4a0d1c; --maroon: #7a1c33; --maroon-light: #a32947; --rose-tint: #f9eef0; --gold: #c9965b; } body.dark { --bg-page: #120408; --bg-card: #1d080e; --border-color: #3d1620; --text-primary: #fcf2f4; --text-secondary: #c498a3; --rose-tint: #2b0d16; } body { font-family: 'Inter', sans-serif; background-color: var(--bg-page); color: var(--text-primary); transition: background-color 0.25s, color 0.25s; } .brand-logo { font-family: 'Grand Hotel', cursive; background: linear-gradient(135deg, #4a0d1c, #8f243d, #c9965b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } body.dark .brand-logo { background: linear-gradient(135deg, #f4b8c5, #d45d79, #e5b880); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .card { background-color: var(--bg-card); border: 1px solid var(--border-color); } .story-ring { background: linear-gradient(45deg, #4a0d1c, #8f243d, #c9965b); padding: 2.5px; border-radius: 9999px; } .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } @keyframes heartPop { 0% { transform: scale(0.4); opacity: 0; } 50% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); opacity: 0; } } .heart-burst { animation: heartPop 0.75s ease-out forwards; } </style> </head> <body class="min-h-screen pb-16"> <!-- TOP NAVBAR --> <header class="sticky top-0 z-40 card border-x-0 border-t-0 backdrop-blur-md bg-opacity-95"> <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3"> <div class="flex items-center gap-2.5"> <a href="#" onclick="resetFeed()" class="brand-logo text-4xl leading-none select-none">Chorus</a> <span class="hidden sm:inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-[#7a1c33] text-white"> Ch. 1–6 </span> </div> <div class="flex-1 max-w-xs"> <input id="searchInput" type="text" placeholder="Search concepts, theorists..." oninput="renderFeed()" class="w-full text-sm px-3.5 py-1.5 rounded-full border border-[var(--border-color)] bg-[var(--rose-tint)] focus:outline-none focus:ring-2 focus:ring-[#7a1c33]" /> </div> <div class="flex items-center gap-2"> <button onclick="openModal('refsModal')" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#7a1c33] hover:bg-[#5c1124] text-white transition"> References </button> <button onclick="toggleTheme()" title="Toggle Theme" class="p-2 rounded-full border border-[var(--border-color)] bg-[var(--rose-tint)] text-xs font-semibold"> 🌓 </button> </div> </div> </header> <!-- MAIN LAYOUT --> <main class="max-w-5xl mx-auto px-4 pt-5 grid grid-cols-1 lg:grid-cols-12 gap-7"> <!-- LEFT / CENTER FEED --> <section class="lg:col-span-8 space-y-5"> <!-- STORIES BAR --> <div class="card rounded-2xl p-4"> <div id="storiesBar" class="flex items-center gap-4 overflow-x-auto no-scrollbar"></div> </div> <!-- CHAPTER FILTER PILLS --> <div id="filterBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div> <!-- POSTS CONTAINER --> <div id="feedContainer" class="space-y-6"></div> </section> <!-- RIGHT SIDEBAR --> <aside class="hidden lg:block lg:col-span-4 space-y-5"> <div class="sticky top-20 space-y-5"> <!-- Profile Card --> <div class="card rounded-2xl p-4 flex items-center gap-3.5"> <div class="story-ring"> <div class="w-12 h-12 rounded-full bg-[#4a0d1c] text-white font-bold flex items-center justify-center text-lg"> C </div> </div> <div class="flex-1 min-w-0"> <p class="font-bold text-sm truncate">chorus.study</p> <p class="text-xs text-[var(--text-secondary)] truncate">Understanding the Self • Ch. 1–6</p> </div> <button onclick="openModal('refsModal')" class="text-xs font-bold text-[#8f243d] hover:underline"> Sources </button> </div> <!-- Chapter Accounts Directory --> <div class="card rounded-2xl p-4 space-y-3"> <div class="flex items-center justify-between"> <span class="text-xs font-bold uppercase tracking-wider text-[var(--text-secondary)]">Dimensions of Self</span> <button onclick="setFilter('all')" class="text-xs font-semibold text-[#8f243d] hover:underline">Show All</button> </div> <div id="sidebarAccounts" class="space-y-2.5"></div> </div> <p class="text-[11px] text-[var(--text-secondary)] px-1 leading-relaxed"> Chorus Interactive Feed • Physical, Sexual, Material, Spiritual, Digital & Political Selves • Maroon Edition </p> </div> </aside> </main> <!-- STORY VIEWER MODAL --> <div id="storyModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4"> <div class="relative w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl bg-[#2a0a12] text-white border border-[#7a1c33]"> <div class="p-3 flex gap-1.5" id="storyProgressBars"></div> <div class="px-4 pb-3 flex items-center justify-between"> <div class="flex items-center gap-2.5"> <img id="storyAvatar" src="" class="w-8 h-8 rounded-full object-cover border border-white/40" alt="" /> <div> <p id="storyHandle" class="text-xs font-bold"></p> <p id="storySubtitle" class="text-[10px] text-rose-200"></p> </div> </div> <button onclick="closeModal('storyModal')" class="text-white/80 hover:text-white text-xl leading-none">&times;</button> </div> <div class="relative h-80"> <img id="storyImage" src="" class="w-full h-full object-cover opacity-55" alt="" /> <div class="absolute inset-0 bg-gradient-to-t from-[#2a0a12] via-[#4a0d1c]/50 to-transparent p-5 flex flex-col justify-end"> <span id="storyBadge" class="inline-block w-fit text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#7a1c33] mb-2"></span> <h3 id="storyTitle" class="text-lg font-extrabold leading-snug mb-1.5"></h3> <p id="storyQuote" class="text-xs text-rose-100 leading-relaxed mb-4"></p> <button id="storyJumpBtn" class="w-full py-2 rounded-xl bg-white text-[#4a0d1c] font-bold text-xs hover:bg-rose-100 transition"> Jump to Chapter Post → </button> </div> </div> </div> </div> <!-- REFERENCES MODAL --> <div id="refsModal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"> <div class="card w-full max-w-2xl max-h-[82vh] rounded-2xl overflow-hidden flex flex-col shadow-2xl"> <div class="px-5 py-4 border-b border-[var(--border-color)] flex items-center justify-between bg-[#4a0d1c] text-white"> <h2 class="font-bold text-base">Academic References (Chapters 1–6)</h2> <button onclick="closeModal('refsModal')" class="text-2xl leading-none hover:text-rose-200">&times;</button> </div> <div id="refsBody" class="p-5 overflow-y-auto space-y-4 text-xs leading-relaxed"></div> </div> </div> <script> const CHAPTERS = [ { id: "ch1", chapterTag: "Ch. 1 • Physical Self", handle: "physicalself", location: "Embodiment & Somatic Awareness", avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80", storyTitle: "Beyond Outward Appearance", storyQuote: "Appreciating our bodies not simply for how they look, but for what they allow us to experience, move, feel, and accomplish.", likes: 248, liked: false, saved: false, caption: "The physical self goes beyond appearance—it shapes how we move, sense, and connect with the world. Swipe through body image, interoception vs. proprioception, and WHO physical wellness habits.", hashtags: "#PhysicalSelf #BodyImage #SomaticAwareness #Interoception #SelfAcceptance", slides: [ { type: "photo", img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=80", badge: "Chapter 1 • Introduction", title: "The Physical Self", text: "Shaped by genetics, family, culture, and social expectations—influencing confidence, body image, and how we experience the world." }, { type: "photo", img: "https://images.unsplash.com/photo-1516575150278-77136aed6920?auto=format&fit=crop&w=900&q=80", badge: "Body Image & Filters", title: "Digital Filters vs. Reality", text: "Vincente-Benito & Ramírez-Durán (2023) highlight how edited photos and beauty standards drive comparison. Self-worth is never defined by filters." }, { type: "card", badge: "Mehling et al. (2009)", title: "Somatic & Body Awareness", bullets: [ "Interoception: Awareness of internal bodily signals—heartbeat, breathing, hunger, thirst, fatigue, and tension.", "Proprioception: Awareness of body position and movement in space without constantly looking.", "Listening to physical cues helps us rest, relax, and respect personal boundaries." ] }, { type: "photo", img: "https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=900&q=80", badge: "WHO (2024) • Wellness", title: "Movement & Body Boundaries", text: "Regular activity (walking, running, dancing, chores) boosts brain and mental health—paired with rest, hydration, and bodily consent." } ], notes: [ "Positive body image means respecting your body without letting appearance dictate personal worth.", "Physical boundaries include personal space, recognizing fatigue, and consent regarding physical contact." ], comments: [ { user: "studybuddy.ph", text: "Interoception vs. proprioception distinction is super clear!" } ] }, { id: "ch2", chapterTag: "Ch. 2 • Sexual Self", handle: "sexualself", location: "Identity, Roles & Consent", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80", storyTitle: "Dignity, Identity & Respect", storyQuote: "Every individual deserves dignity and respect regardless of their identity, gender expression, or personal experiences.", likes: 312, liked: false, saved: false, caption: "Understanding the sexual self means exploring identity, questioning rigid gender socialization in Filipino society, and practicing enthusiastic, ongoing consent in healthy relationships.", hashtags: "#SexualSelf #GenderSocialization #HealthyBoundaries #Consent #MutualRespect", slides: [ { type: "photo", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80", badge: "Chapter 2 • WHO Framework", title: "Understanding the Sexual Self", text: "Encompasses biological traits, gender identity, gender roles, sexual orientation, intimacy, relationships, and personal values." }, { type: "photo", img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80", badge: "APA (2023) • Socialization", title: "Gender Socialization & Culture", text: "Society conditions roles from childhood—often reinforced by family, religion, and media. Recognizing learned expectations empowers us to challenge stereotypes." }, { type: "photo", img: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=80", badge: "UNESCO (2018) • Relationships", title: "Consent & Personal Boundaries", text: "Consent must be freely given, reversible at any moment, and specific. Healthy relationships thrive on trust, honesty, and safety." } ], notes: [ "Sexuality is shaped by biological, psychological, social, cultural, economic, political, and legal factors (WHO).", "Agreement to one activity never automatically implies agreement to another." ], comments: [ { user: "psych.notes", text: "Love how Filipino cultural norms are connected to APA gender-role socialization." } ] }, { id: "ch3", chapterTag: "Ch. 3 • Material Self", handle: "materialself", location: "Extended Self & Mindful Consumption", avatar: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300&q=80", storyTitle: "Who You Are > What You Own", storyQuote: "What people own may reveal aspects of their identity, but who they are is much greater than what they possess.", likes: 194, liked: false, saved: false, caption: "From William James (1890) and Russell Belk's Extended Self (1988) to Tim Kasser's critique of materialism (2002): why sentimental keepsakes matter more than status symbols.", hashtags: "#MaterialSelf #ExtendedSelf #WilliamJames #RussellBelk #MindfulConsumption", slides: [ { type: "photo", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80", badge: "William James (1890)", title: "Components of the Material Self", text: "Includes the Body, Clothing (self-expression), Immediate Family, and Home & Possessions—objects woven into our emotional identity." }, { type: "photo", img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=80", badge: "Russell Belk (1988)", title: "The Extended Self Theory", text: "A gifted watch or a laptop representing years of study holds symbolic and emotional value far beyond monetary price." }, { type: "card", badge: "Tim Kasser (2002)", title: "Materialism vs. Well-Being", bullets: [ "Materialism: Measuring self-worth and happiness primarily through wealth and status.", "Symbolic Consumption: Buying items for social image rather than practical function.", "Responsible Consumption: Ask if a purchase meets a genuine need or chases temporary validation." ] } ], notes: [ "Losing sentimental belongings can feel like losing part of oneself because of emotional attachment.", "Material goods provide comfort and utility, but basing self-worth on wealth harms psychological well-being." ], comments: [] }, { id: "ch4", chapterTag: "Ch. 4 • Spiritual Self", handle: "spiritualself", location: "Meaning, Values & Mindfulness", avatar: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=300&q=80", storyTitle: "Inner Conscience & Purpose", storyQuote: "A meaningful life is shaped by our values, personal growth, relationships, and the purpose we create through experience.", likes: 276, liked: false, saved: false, caption: "Spirituality goes beyond religion alone—encompassing moral conscience (James), finding meaning even in hardship (Viktor Frankl), and present-moment mindfulness (Jon Kabat-Zinn).", hashtags: "#SpiritualSelf #Logotherapy #ViktorFrankl #Mindfulness #InnerPurpose", slides: [ { type: "photo", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=900&q=80", badge: "Chapter 4 • Inner Dimension", title: "The Spiritual Self", text: "James (1890) defined it as our subjective being: consciousness, moral values, conscience, intellect, and personal dispositions." }, { type: "card", badge: "Viktor Frankl (1963)", title: "Logotherapy: 3 Paths to Meaning", bullets: [ "1. Creative Values: Work, achievements, creativity, and contributing to society.", "2. Experiential Values: Love, meaningful relationships, and appreciating beauty/nature.", "3. Attitudinal Values: Choosing courage and dignity when facing unavoidable hardship." ] }, { type: "photo", img: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80", badge: "Kabat-Zinn (1994) & Poll & Smith (2003)", title: "Mindfulness & Transcendence", text: "Paying intentional attention to the present moment aligns daily actions with integrity, gratitude, and connection beyond oneself." } ], notes: [ "Material Self (external possessions) and Spiritual Self (internal values) interact every time our ethics guide what we buy or value." ], comments: [ { user: "mindful.learner", text: "Frankl's 3 values (Creative, Experiential, Attitudinal) are a great exam anchor." } ] }, { id: "ch5", chapterTag: "Ch. 5 • Digital Self", handle: "digitalself", location: "Screen-Time Audit & Context Collapse", avatar: "https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&w=300&q=80", storyTitle: "12h 52m Daily Screen-Time Audit", storyQuote: "Setting limits on passive scrolling and diversifying our feed beyond algorithm-driven echo chambers.", likes: 341, liked: false, saved: false, caption: "Reflecting on online presence, Marwick & boyd's (2011) Context Collapse, recommendation algorithms, and a real screen-time audit featuring Philippine news & UAAP sports feeds.", hashtags: "#DigitalSelf #ContextCollapse #ScreenTimeAudit #DigitalWellbeing #AlgorithmAwareness", slides: [ { type: "screentime", badge: "Personal Screen-Time Audit", title: "Most Used Apps & Attention Split", avg: "12h 52m", today: "4h 35m (Nov 21)", apps: [ { name: "TikTok", time: "1h 45m", pct: "88%" }, { name: "Facebook", time: "1h 14m", pct: "64%" }, { name: "Messenger", time: "37m", pct: "34%" }, { name: "Instagram", time: "17m", pct: "18%" } ], note: "Dominated by Politics & Sports; rarely sees Science or Arts." }, { type: "feedcollage", badge: "Algorithmic Feed Audit", title: "Topics Encountered Most Often", leftTitle: "49th ASEAN Summit", leftSub: "President Marcos Urges ASEAN Unity Amid Global Challenges", rightTitle: "UAAP Season 89 Cheerdance", rightSub: "FEU Cheering Squad — 2nd Runner-Up", footer: "Recommendation signals reinforce repeated topics—requiring intentional effort to seek diverse perspectives." }, { type: "card", badge: "Marwick & boyd (2011)", title: "Context Collapse & Digital Reflection", bullets: [ "Context Collapse: Friends, family, classmates, and strangers merge into one audience—shaping what we curate or hide online.", "Beyond Hours: How apps make us feel afterward (informed yet guilty over high screen time) matters as much as total minutes.", "Goal: Set scrolling boundaries and make room for offline activities." ] } ], notes: [ "Filter bubble research shows mixed findings (Leysen et al., 2022), yet auditing our feeds reveals blind spots in topics we rarely see." ], comments: [ { user: "feu.tamaraw", text: "Shoutout to the UAAP Season 89 Cheerdance 2nd Runner-Up highlight!" } ] }, { id: "ch6", chapterTag: "Ch. 6 • Political Self", handle: "politicalself", location: "Civic Agency & Community Outreach", avatar: "https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&w=300&q=80", storyTitle: "From Online Attention to Civic Agency", storyQuote: "Think before sharing, listen before judging, and turn online awareness into real-world community service.", likes: 389, liked: false, saved: false, caption: "Civic participation goes beyond voting—from fact-checking and respectful discourse (Agojo et al., 2023) to community feeding programs and coastal cleanup drives.", hashtags: "#PoliticalSelf #CivicAgency #ResponsibleDigitalCitizen #YouthActivism #CommunityService", slides: [ { type: "photo", img: "https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&w=900&q=80", badge: "Community Outreach", title: "Serving Local Community Needs", text: "True civic agency connects online awareness to grassroots action—such as barangay feeding initiatives and local volunteer support." }, { type: "photo", img: "https://images.unsplash.com/photo-1618477461853-cf6ed80faba5?auto=format&fit=crop&w=900&q=80", badge: "Environmental & Civic Action", title: "Coastal Cleanup & Collective Effort", text: "Agojo et al. (2023) note that while social media amplifies Filipino youth voices, lasting impact grows through offline solidarity." }, { type: "card", badge: "Personal Commitment", title: "My Civic Manifesto", bullets: [ "Think before I share and listen before I judge.", "Verify trustworthiness rather than reposting solely out of confirmation bias.", "Use my voice online to raise awareness—and step up offline to help my community." ] } ], notes: [ "Jung, Dai, & Albarracín (2024) examine how social media algorithms shape offline civic participation." ], comments: [ { user: "civic.youth.ph", text: "Think before sharing, listen before judging—words to live by." } ] } ]; const REFERENCES = [ { chapter: "Chapter 1: The Physical Self", items: [ "Mehling, W. E., et al. (2009). Body awareness: Construct and self-report measures. PLOS ONE, 4(5), e5614.", "Parma, C., et al. (2024). An overview of the bodily awareness representation and interoception. Brain Sciences, 14(4), 386.", "Vincente-Benito, I., & Ramírez-Durán, M. D. V. (2023). Influence of social media use on body image and well-being among adolescents and young adults. Journal of Psychosocial Nursing, 61(12), 11–18.", "World Health Organization. (2024, June 26). Physical activity." ] }, { chapter: "Chapter 2: The Sexual Self", items: [ "American Psychological Association. (2023). Gender-role socialization. APA Dictionary of Psychology.", "UNESCO, UNAIDS, UNFPA, UNICEF, UN Women, & WHO. (2018). International technical guidance on sexuality education.", "World Health Organization. (2021). Gender and health / Defining sexual health." ] }, { chapter: "Chapter 3: The Material Self", items: [ "Belk, R. W. (1988). Possessions and the extended self. Journal of Consumer Research, 15(2), 139–168.", "James, W. (1890). The principles of psychology (Vol. 1). Henry Holt and Company.", "Kasser, T. (2002). The high price of materialism. MIT Press." ] }, { chapter: "Chapter 4: The Spiritual Self", items: [ "Frankl, V. E. (1963). Man's search for meaning: An introduction to logotherapy. Beacon Press.", "James, W. (1890). The principles of psychology (Vol. 1). Henry Holt and Company.", "Kabat-Zinn, J. (1994). Wherever you go, there you are: Mindfulness meditation in everyday life. Hyperion.", "Poll, J. B., & Smith, T. B. (2003). The spiritual self: Toward a conceptualization of spiritual identity development. Journal of Psychology and Theology, 31(2), 129–142." ] }, { chapter: "Chapters 5 & 6: The Digital & Political Selves", items: [ "Agojo, K. N. M., et al. (2023). Activism beyond the streets: Examining social media usage and youth activism in the Philippines. Asian Journal of Social Science, 51(3), 180–187.", "Jung, H., Dai, W., & Albarracín, D. (2024). How social media algorithms shape offline civic participation. Perspectives on Psychological Science.", "Leysen, J., et al. (2022). What are filter bubbles really? Adjunct Proceedings of the 30th ACM UMAP.", "Marwick, A. E., & boyd, d. (2011). I tweet honestly, I tweet passionately: Twitter users, context collapse, and the imagined audience. New Media & Society, 13(1), 114–133." ] } ]; let activeFilter = "all"; const slideState = {}; CHAPTERS.forEach(c => slideState[c.id] = 0); function toggleTheme() { document.body.classList.toggle("dark"); } function openModal(id) { document.getElementById(id).classList.remove("hidden"); } function closeModal(id) { document.getElementById(id).classList.add("hidden"); } function setFilter(id) { activeFilter = id; renderFilters(); renderFeed(); } function resetFeed() { activeFilter = "all"; document.getElementById("searchInput").value = ""; renderFilters(); renderFeed(); } function renderStories() { const bar = document.getElementById("storiesBar"); bar.innerHTML = CHAPTERS.map((ch, idx) => ` <button onclick="openStory(${idx})" class="flex flex-col items-center gap-1.5 shrink-0 group"> <div class="story-ring group-hover:scale-105 transition"> <img src="${ch.avatar}" alt="${ch.handle}" class="w-14 h-14 rounded-full object-cover border-2 border-[var(--bg-card)]" /> </div> <span class="text-[11px] font-medium max-w-[74px] truncate">${ch.handle}</span> </button> `).join(""); } function openStory(idx) { const ch = CHAPTERS[idx]; document.getElementById("storyProgressBars").innerHTML = CHAPTERS.map((_, i) => ` <div class="h-1 flex-1 rounded-full ${i <= idx ? 'bg-white' : 'bg-white/30'}"></div> `).join(""); document.getElementById("storyAvatar").src = ch.avatar; document.getElementById("storyHandle").textContent = `@${ch.handle}`; document.getElementById("storySubtitle").textContent = ch.location; const firstPhoto = ch.slides.find(s => s.img)?.img || ch.avatar; document.getElementById("storyImage").src = firstPhoto; document.getElementById("storyBadge").textContent = ch.chapterTag; document.getElementById("storyTitle").textContent = ch.storyTitle; document.getElementById("storyQuote").textContent = `"${ch.storyQuote}"`; document.getElementById("storyJumpBtn").onclick = () => { closeModal("storyModal"); setFilter(ch.id); }; openModal("storyModal"); } function renderFilters() { const bar = document.getElementById("filterBar"); const pills = [{ id: "all", label: "All Chapters" }, ...CHAPTERS.map(c => ({ id: c.id, label: c.chapterTag }))]; bar.innerHTML = pills.map(p => { const active = activeFilter === p.id; return ` <button onclick="setFilter('${p.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold shrink-0 transition ${ active ? 'bg-[#7a1c33] text-white shadow-sm' : 'card hover:border-[#7a1c33]' }"> ${p.label} </button> `; }).join(""); } function renderSidebar() { const box = document.getElementById("sidebarAccounts"); box.innerHTML = CHAPTERS.map(ch => ` <div class="flex items-center justify-between gap-2.5"> <div class="flex items-center gap-2.5 min-w-0"> <img src="${ch.avatar}" alt="${ch.handle}" class="w-9 h-9 rounded-full object-cover border border-[var(--border-color)]" /> <div class="min-w-0"> <p class="text-xs font-bold truncate">${ch.handle}</p> <p class="text-[11px] text-[var(--text-secondary)] truncate">${ch.chapterTag}</p> </div> </div> <button onclick="setFilter('${ch.id}')" class="text-xs font-bold text-[#8f243d] hover:underline shrink-0"> View </button> </div> `).join(""); } function renderSlideContent(ch, slide) { if (slide.type === "photo") { return ` <div class="relative w-full h-[380px] sm:h-[420px] bg-[#2a0a12] select-none"> <img src="${slide.img}" alt="${slide.title}" class="w-full h-full object-cover opacity-80" /> <div class="absolute inset-0 bg-gradient-to-t from-[#2a0a12] via-[#4a0d1c]/45 to-transparent p-6 flex flex-col justify-end text-white"> <span class="inline-block w-fit text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-[#7a1c33] mb-2"> ${slide.badge} </span> <h3 class="text-xl font-extrabold leading-snug mb-1.5">${slide.title}</h3> <p class="text-xs sm:text-sm text-rose-100 leading-relaxed">${slide.text}</p> </div> </div> `; } if (slide.type === "screentime") { return ` <div class="w-full h-[380px] sm:h-[420px] bg-gradient-to-br from-[#2a0a12] via-[#4a0d1c] to-[#7a1c33] text-white p-6 flex flex-col justify-between select-none"> <div> <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-white/15 mb-2"> ${slide.badge} </span> <h3 class="text-lg font-extrabold">${slide.title}</h3> <div class="mt-2 flex items-baseline gap-4"> <div> <p class="text-[10px] uppercase text-rose-200">Daily Average</p> <p class="text-2xl font-extrabold text-[#f3c68f]">${slide.avg}</p> </div> <div> <p class="text-[10px] uppercase text-rose-200">Sample Day</p> <p class="text-sm font-bold">${slide.today}</p> </div> </div> </div> <div class="space-y-2.5"> ${slide.apps.map(app => ` <div> <div class="flex justify-between text-xs font-semibold mb-1"> <span>${app.name}</span> <span class="text-rose-200">${app.time}</span> </div> <div class="w-full h-2 rounded-full bg-white/15 overflow-hidden"> <div class="h-full rounded-full bg-[#e5b880]" style="width:${app.pct}"></div> </div> </div> `).join("")} </div> <p class="text-[11px] text-rose-100/90 border-t border-white/15 pt-2.5">${slide.note}</p> </div> `; } if (slide.type === "feedcollage") { return ` <div class="w-full h-[380px] sm:h-[420px] bg-gradient-to-br from-[#3b0b17] to-[#6e172d] text-white p-6 flex flex-col justify-between select-none"> <div> <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-white/15 mb-2"> ${slide.badge} </span> <h3 class="text-lg font-extrabold">${slide.title}</h3> </div> <div class="grid grid-cols-2 gap-3 my-auto"> <div class="rounded-2xl p-4 bg-white/10 border border-white/15 flex flex-col justify-between"> <span class="text-[10px] font-bold uppercase text-[#f3c68f]">Politics • News</span> <p class="font-extrabold text-sm mt-2">${slide.leftTitle}</p> <p class="text-[11px] text-rose-100 mt-1.5 leading-relaxed">${slide.leftSub}</p> </div> <div class="rounded-2xl p-4 bg-white/10 border border-white/15 flex flex-col justify-between"> <span class="text-[10px] font-bold uppercase text-[#f3c68f]">Sports • UAAP</span> <p class="font-extrabold text-sm mt-2">${slide.rightTitle}</p> <p class="text-[11px] text-rose-100 mt-1.5 leading-relaxed">${slide.rightSub}</p> </div> </div> <p class="text-xs text-rose-100 border-t border-white/15 pt-3 leading-relaxed">${slide.footer}</p> </div> `; } return ` <div class="w-full h-[380px] sm:h-[420px] bg-gradient-to-br from-[#4a0d1c] via-[#6d172c] to-[#8f243d] text-white p-6 sm:p-8 flex flex-col justify-center select-none"> <span class="inline-block w-fit text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-white/15 mb-3"> ${slide.badge} </span> <h3 class="text-xl font-extrabold mb-4">${slide.title}</h3> <ul class="space-y-3 text-xs sm:text-sm text-rose-50 leading-relaxed"> ${slide.bullets.map(b => `<li class="flex gap-2.5"><span class="text-[#f3c68f] font-bold">✦</span><span>${b}</span></li>`).join("")} </ul> </div> `; } function changeSlide(chId, dir) { const ch = CHAPTERS.find(c => c.id === chId); const total = ch.slides.length; slideState[chId] = (slideState[chId] + dir + total) % total; renderFeed(); } function doubleTapLike(chId) { const ch = CHAPTERS.find(c => c.id === chId); if (!ch.liked) { ch.liked = true; ch.likes++; } renderFeed(); const burst = document.getElementById(`burst-${chId}`); if (burst) { burst.classList.remove("hidden"); setTimeout(() => burst.classList.add("hidden"), 750); } } function toggleLike(chId) { const ch = CHAPTERS.find(c => c.id === chId); ch.liked = !ch.liked; ch.likes += ch.liked ? 1 : -1; renderFeed(); } function toggleSave(chId) { const ch = CHAPTERS.find(c => c.id === chId); ch.saved = !ch.saved; renderFeed(); } function addComment(e, chId) { e.preventDefault(); const input = document.getElementById(`comment-input-${chId}`); const text = input.value.trim(); if (!text) return; const ch = CHAPTERS.find(c => c.id === chId); ch.comments.push({ user: "you", text }); input.value = ""; renderFeed(); } function renderFeed() { const query = document.getElementById("searchInput").value.toLowerCase().trim(); const container = document.getElementById("feedContainer"); const filtered = CHAPTERS.filter(ch => { const matchesFilter = activeFilter === "all" || ch.id === activeFilter; const blob = `${ch.chapterTag} ${ch.handle} ${ch.location} ${ch.caption} ${ch.hashtags} ${JSON.stringify(ch.slides)}`.toLowerCase(); return matchesFilter && (!query || blob.includes(query)); }); if (!filtered.length) { container.innerHTML = ` <div class="card rounded-2xl p-10 text-center space-y-2"> <p class="font-bold text-sm">No matching chapters found</p> <button onclick="resetFeed()" class="text-xs font-bold text-[#8f243d] underline">Reset filters</button> </div> `; return; } container.innerHTML = filtered.map(ch => { const idx = slideState[ch.id] || 0; const currentSlide = ch.slides[idx]; return ` <article class="card rounded-2xl overflow-hidden shadow-sm"> <!-- Post Header --> <div class="px-4 py-3 flex items-center justify-between"> <div class="flex items-center gap-3"> <div class="story-ring"> <img src="${ch.avatar}" alt="${ch.handle}" class="w-9 h-9 rounded-full object-cover border border-[var(--bg-card)]" /> </div> <div> <div class="flex items-center gap-2"> <span class="font-bold text-sm">${ch.handle}</span> <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[var(--rose-tint)] text-[#7a1c33] border border-[var(--border-color)]"> ${ch.chapterTag} </span> </div> <p class="text-[11px] text-[var(--text-secondary)]">${ch.location}</p> </div> </div> <span class="text-xs font-semibold text-[var(--text-secondary)]">${idx + 1}/${ch.slides.length}</span> </div> <!-- Carousel Viewport --> <div class="relative" ondblclick="doubleTapLike('${ch.id}')"> ${renderSlideContent(ch, currentSlide)} <div id="burst-${ch.id}" class="hidden pointer-events-none absolute inset-0 flex items-center justify-center"> <span class="text-7xl drop-shadow-lg heart-burst">❤️</span> </div> ${ch.slides.length > 1 ? ` <button onclick="changeSlide('${ch.id}', -1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center text-sm"> ‹ </button> <button onclick="changeSlide('${ch.id}', 1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center text-sm"> › </button> ` : ""} </div> <!-- Action Bar --> <div class="px-4 pt-3 pb-2 flex items-center justify-between"> <div class="flex items-center gap-4"> <button onclick="toggleLike('${ch.id}')" class="text-xl transition hover:scale-110"> ${ch.liked ? "❤️" : "🤍"} </button> <label for="comment-input-${ch.id}" class="text-xl cursor-pointer transition hover:scale-110">💬</label> </div> <div class="flex items-center gap-1.5"> ${ch.slides.map((_, sIdx) => ` <span class="h-1.5 rounded-full transition-all ${sIdx === idx ? 'w-4 bg-[#7a1c33]' : 'w-1.5 bg-[#d8b8c0]'}"></span> `).join("")} </div> <button onclick="toggleSave('${ch.id}')" class="text-lg transition hover:scale-110" title="Bookmark"> ${ch.saved ? "🔖" : "📑"} </button> </div> <!-- Likes, Caption & Study Notes --> <div class="px-4 pb-4 space-y-2"> <p class="text-xs font-bold">${ch.likes.toLocaleString()} likes</p> <p class="text-xs sm:text-sm leading-relaxed"> <span class="font-bold mr-1">${ch.handle}</span>${ch.caption} </p> <p class="text-xs font-medium text-[#8f243d]">${ch.hashtags}</p> <details class="pt-1"> <summary class="text-xs font-semibold text-[#7a1c33] cursor-pointer select-none"> View Chapter Key Takeaways </summary> <ul class="mt-2 p-3 rounded-xl bg-[var(--rose-tint)] border border-[var(--border-color)] space-y-1.5 text-xs"> ${ch.notes.map(n => `<li>• ${n}</li>`).join("")} </ul> </details> <!-- Comments --> ${ch.comments.length ? ` <div class="pt-1 space-y-1"> ${ch.comments.map(c => ` <p class="text-xs"><span class="font-bold mr-1">${c.user}</span>${c.text}</p> `).join("")} </div> ` : ""} <form onsubmit="addComment(event, '${ch.id}')" class="pt-2 border-t border-[var(--border-color)] flex items-center gap-2"> <input id="comment-input-${ch.id}" type="text" placeholder="Add a study reflection..." class="flex-1 text-xs bg-transparent focus:outline-none" /> <button type="submit" class="text-xs font-bold text-[#7a1c33] hover:opacity-80">Post</button> </form> </div> </article> `; }).join(""); } function renderReferences() { document.getElementById("refsBody").innerHTML = REFERENCES.map(sec => ` <div> <h3 class="font-bold text-sm text-[#7a1c33] mb-1.5">${sec.chapter}</h3> <ul class="space-y-1.5 text-[var(--text-secondary)]"> ${sec.items.map(item => `<li>• ${item}</li>`).join("")} </ul> </div> `).join(""); } renderStories(); renderFilters(); renderSidebar(); renderFeed(); renderReferences(); </script> </body> </html>
